<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG - Hunter Dragon</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="settings-button" href="">
      <img
        src="https://icons.iconarchive.com/icons/dtafalonso/android-lollipop/256/Settings-icon.png"
        lat="settings icon"
      />
    </a>
    <div class="game-container">
      <div class="stats">
        <span class="stat">XP: <span class="xp-stat">0</span></span>
        <span class="stat">Health: <span class="health-stat">100</span></span>
        <span class="stat">Gold: <span class="gold-stat">10</span></span>
      </div>
      <div>
        <div class="actions">
          <button class="button1">Go to store</button>
          <button class="button2">Go to cave</button>
          <button class="button3">Fight dragon</button>
        </div>
        <div class="enemy-stats">
          <span class="stat"
            >Monster Name: <span class="enemy-name"></span
          ></span>
          <span class="stat">Health: <span class="enemy-health"></span></span>
        </div>
      </div>
    </div>
    <div class="message-container">
      <p>
        Welcome to Hunter Dragon. You must defeat the dragon that is preventing
        people from leaving the town.
      </p>
    </div>
    <form class="form-stats-container">
      <p class="form-text">
        Before embarking on this journey, you must choose a name and a class
        that will define your skills and your path. Here are some options:
      </p>
      <input
        type="text"
        class="player-name"
        required
        placeholder="Select a  name"
      />
      <select class="player-class" required>
        <option value="">Select a class</option>
        <option value="warrior">Warrior</option>
        <option value="archer">Archer</option>
        <option value="mage">Mage</option>
      </select>
      <button type="button" class="btn-start">Start the travel</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
